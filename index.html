<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Favicon: logo de Junkbox (SVG original de Figma). Letras oscuras en tema claro y claras en oscuro. -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/brand/junkbox-logo-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/brand/junkbox-logo-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <title>Junkbox</title>
    <!-- Tema elegido con el botón de sol/luna (shared/utils/theme.ts, misma clave). Se aplica antes
         de pintar para que no parpadee; sin elección, la app sigue el tema del sistema. -->
    <script>
      try {
        var theme = localStorage.getItem('junkbox.theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
